name: Build & Test Ahmed OS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore AhmedOS.slnx

    - name: Build solution
      run: dotnet build AhmedOS.slnx -c Release --no-restore

    - name: Run unit tests
      run: dotnet test tests/AhmedOS.Tests/AhmedOS.Tests.csproj -c Release --no-build --verbosity normal
